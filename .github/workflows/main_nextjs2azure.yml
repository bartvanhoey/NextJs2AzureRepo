name: Build and deploy Next.js app to Azure Web App

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  APPLICATION_PUBLISH_PROFILE: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
  WEBAPP_NAME: "nextjs2azure"
  NEXT_PUBLIC_BASE_URL: ${{ secrets.NEXT_PUBLIC_BASE_URL }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'  # Recommended LTS for Azure

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js app
        run: npm run build

      - name: Upload artifact for deployment
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: .

      - name: Login to Azure using publish profile
        run: |
          az webapp deployment list-publishing-profiles \
          --name ${{ env.WEBAPP_NAME }} \
          --resource-group rgNextJs2AzureApp \
          --xml publish-profile.xml

      - name: Set SCM_DO_BUILD_DURING_DEPLOYMENT
        run: |
          USERNAME=$(xmllint --xpath "string(//publishProfile[@publishMethod='MSDeploy']/@userName)" publish-profile.xml)
          PASSWORD=$(xmllint --xpath "string(//publishProfile[@publishMethod='MSDeploy']/@userPWD)" publish-profile.xml)
          az webapp deployment login --name ${{ env.WEBAPP_NAME }} \
                               --resource-group rgNextJs2AzureApp \
                               --user $USERNAME --password $PASSWORD
          az webapp config appsettings set \
          --name ${{ env.WEBAPP_NAME }} \
          --resource-group rgNextJs2AzureApp \
          --settings SCM_DO_BUILD_DURING_DEPLOYMENT=false


  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: node-app


      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.WEBAPP_NAME }}
          slot-name: Production
          publish-profile: ${{ env.APPLICATION_PUBLISH_PROFILE }}
          package: .
          app-settings: SCM_DO_BUILD_DURING_DEPLOYMENT=false
          
          
